name: Bug report
description: Report a reproducible defect in Accidion Identity Cloud.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Report only information that is safe to share publicly. Never include credentials, tokens, personal data, customer data, production identifiers, or secrets.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What is broken?
      placeholder: Describe the observed problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest safe, repeatable set of steps.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and version
      description: Include relevant application version, component, and non-sensitive environment details.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Safe logs or evidence
      description: Redact tokens, identifiers, personal data, customer data, and secrets before sharing.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I have removed secrets, credentials, personal data, and customer data.
          required: true
        - label: I have searched for an existing issue describing this problem.
          required: false
